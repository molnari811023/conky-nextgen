local conf_dir = debug.getinfo(1, "S").source:match("@?(.*/)") or "./"
local conky_dir = conf_dir:gsub("/panel_systray/?$", "")
if conky_dir == "" or conky_dir == conf_dir then
    conky_dir = (os.getenv("HOME") or "/root") .. "/.conky"
end
lfs = require("lfs")
package.path = package.path
    .. ";" .. conky_dir .. "/panel_systray/?.lua"
    .. ";" .. conky_dir .. "/lua/?.lua"

dofile(conky_dir .. "/lua/apps.lua")

local MAIN_CATEGORIES = {
    AudioVideo  = "Multimedia",
    Audio       = "Multimedia",
    Video       = "Multimedia",
    Development = "Development",
    Education   = "Education",
    Game        = "Games",
    Graphics    = "Graphics",
    Network     = "Network",
    Office      = "Office",
    Science     = "Science",
    Settings    = "Settings",
    System      = "System",
    Utility     = "Utilities",
}

local seen_cats = {}
local num_cats = 0
for _, app in ipairs(apps_list()) do
    local cat_name = "Other"
    for _, c in ipairs(app.categories or {}) do
        if MAIN_CATEGORIES[c] then
            cat_name = MAIN_CATEGORIES[c]
            break
        end
    end
    if not seen_cats[cat_name] then
        seen_cats[cat_name] = true
        num_cats = num_cats + 1
    end
end
if num_cats < 1 then num_cats = 1 end

-- Geometry: Y = num_categories * (icon_size + row_pad) + top/bottom padding
local ICON_SIZE = 22
local ROW_PAD   = 14
local ROW_H     = ICON_SIZE + ROW_PAD -- 36 px per row
local PAD_X     = 10
local PAD_Y     = 10
local CAT_W     = 176
local COL_GAP   = 10
local APP_W     = 244
local FOOTER_H  = 40

local MENU_W = PAD_X * 2 + CAT_W + COL_GAP + APP_W
local MENU_H = PAD_Y * 2 + num_cats * ROW_H + FOOTER_H

local conf_dir = debug.getinfo(1, "S").source:match("@?(.*/)") or "./"
local win_common = dofile(conf_dir .. "window_common.lua")

conky.config = win_common.apply({
    background = false,
    double_buffer = true,
    use_xft = true,
    font = 'Sans:size=10',

    own_window_class = 'start_menu_conky',

    alignment = 'bottom_left',
    gap_x = 8,

    update_interval = 0.15,
    total_run_times = 0,
    minimum_width = MENU_W,
    maximum_width = MENU_W,
    minimum_height = MENU_H,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    border_inner_margin = 0,
    border_outer_margin = 0,
    border_width = 0,
    default_color = '#3daee9',

    lua_load = conky_dir .. '/panel_systray/start_menu.lua',
    lua_draw_hook_pre = 'conky_core_main',
    lua_mouse_hook = 'conky_on_mouse',
    lua_shutdown_hook = 'conky_cleanup',
}, "popup")

conky.text = [[

]]
