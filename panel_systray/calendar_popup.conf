-- calendar_popup.conf — Universal X11 & Wayland popup calendar anchored above the panel clock
local conf_dir = debug.getinfo(1, "S").source:match("@?(.*/)") or "./"
local conky_dir = conf_dir:gsub("/panel_systray/?$", "")
if conky_dir == "" or conky_dir == conf_dir then
    conky_dir = (os.getenv("HOME") or "/root") .. "/.conky"
end
local win_common = dofile(conf_dir .. "window_common.lua")

conky.config = win_common.apply({
    background = false,
    double_buffer = true,
    use_xft = true,
    font = 'Sans:size=10',

    own_window_class = 'calendar_popup_conky',

    alignment = 'bottom_right',
    gap_x = 8,

    update_interval = 0.15,
    total_run_times = 0,
    minimum_width = 360,
    maximum_width = 360,
    minimum_height = 360,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    border_inner_margin = 0,
    border_outer_margin = 0,
    border_width = 0,

    lua_load = conky_dir .. '/panel_systray/calendar_popup.lua',
    lua_draw_hook_pre = 'conky_core_main',
    lua_mouse_hook = 'conky_on_mouse',
    lua_shutdown_hook = 'conky_cleanup',
}, "popup")

conky.text = [[

]]
