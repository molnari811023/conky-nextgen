# panel_systray.conf — systray layout/config for panel_systray
# CLI args still override these values.
#
# conky_class   conky panel window class to embed into
conky_class = panel_conky

# right         pin the tray next to the clock / right edge of the host
right = 1

# center_y      vertically center the tray inside the host (1 = yes);
#               when on, y is computed as (host_height - tray_height) / 2
center_y = 1

# padding       gap in px between the clock and the tray's right edge.
#               The tray auto-detects the clock's left edge (drawn by Conky)
#               and sits `padding` px to its left; x is only a fallback.
padding = 10

# x             right margin when right=1, else left offset (px) — fallback
#               if the clock cannot be detected
x = 70
y = 2

# icon_size     per-icon size in px
icon_size = 24

# spacing       gap between icons in px
spacing = 3

# rows          number of grid rows (1 = one line)
rows = 1

# orientation   h = horizontal, v = vertical
orientation = h