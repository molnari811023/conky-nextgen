-- panel.conf — Universal X11 & Wayland bottom Conky panel hosting the
-- tasklist, clock, and systray, wired into the NextGen Lua engine.
-- Run via: ./start_panel.sh

local conf_dir = debug.getinfo(1, "S").source:match("@?(.*/)") or "./"
local win_common = dofile(conf_dir .. "window_common.lua")

conky.config = win_common.apply({
  background = false,
  double_buffer = true,
  use_xft = true,
  font = 'Sans:size=10',

  own_window_class = 'panel_conky',

  -- full-width bottom bar
  alignment = 'bottom_middle',
  gap_x = 0,
  gap_y = 0,

  update_interval = 0.5,
  total_run_times = 0,
  minimum_width = 1920,
  maximum_width = 1920,
  minimum_height = 48,

  draw_shades = false,
  draw_outline = false,
  draw_borders = false,
  draw_graph_borders = false,
  border_inner_margin = 0,
  border_outer_margin = 0,
  border_width = 0,
  default_color = '#3daee9',

  lua_load = conf_dir .. 'panel.lua',
  lua_draw_hook_pre = 'conky_core_main',
  lua_mouse_hook = 'conky_on_mouse',
  lua_shutdown_hook = 'conky_cleanup',
}, "panel")

conky.text = [[

]]
