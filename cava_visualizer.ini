; conky-nextgen visualizer.conf — cava config
; Used by sh/cava_visualizer.sh. 12 bars, raw ASCII output to stdout,
; piped through a small wrapper that keeps only the latest frame in
; tmp/cava_bars.txt (see sh/cava_visualizer.sh for why: cava streams
; continuously, but every other data source in this project is a
; plain file that's read fresh each draw frame — the wrapper bridges
; that gap instead of the Lua side needing to read a live stream).

[general]
bars = 12
framerate = 30
sensitivity = 100

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
integral = 77
gravity = 100
