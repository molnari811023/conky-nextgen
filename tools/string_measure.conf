-- tools/string_measure — Conky NextGen dev tool
-- Conky wrapper for string_measure.lua. Measures the longest translation
-- per key across language/*.mo and writes tools/string_measure.txt, then exits.
--   conky -c tools/string_measure.conf && cat tools/string_measure.txt

conky.config = {
  background = true,
    out_to_wayland = true,
    out_to_x = true,

  double_buffer = true,
  use_xft = true,
  font = 'Sans:size=10',
  own_window = true,
  own_window_type = 'override',
  own_window_hints = 'above,sticky,skip_taskbar,skip_pager,undecorated',
  alignment = 'top_left',
  update_interval = 1,
  total_run_times = 1,
  lua_load = 'string_measure.lua',
  lua_draw_hook_pre = 'string_measure_main',
}

conky.text = [[
]]