<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232933"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dde3ea"/>
    </linearGradient>
  </defs>

  <!-- background rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)"/>

  <!-- canvas card -->
  <rect x="20" y="26" width="88" height="76" rx="8" fill="url(#card)"/>

  <!-- text line -->
  <rect x="30" y="38" width="44" height="6" rx="3" fill="#9aa7b4"/>
  <rect x="82" y="38" width="18" height="6" rx="3" fill="#c2ccd6"/>

  <!-- bar 1 -->
  <rect x="30" y="56" width="18" height="34" rx="3" fill="#3daee9"/>
  <!-- bar 2 -->
  <rect x="54" y="66" width="18" height="24" rx="3" fill="#27ae60"/>
  <!-- bar 3 -->
  <rect x="78" y="50" width="18" height="40" rx="3" fill="#f4a823"/>

  <!-- clock ring -->
  <circle cx="46" cy="64" r="26" fill="none" stroke="#3daee9" stroke-width="6"/>
  <line x1="46" y1="64" x2="46" y2="48" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="46" y1="64" x2="58" y2="70" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- cursor -->
  <path d="M96 92 l-8 20 6 -4 6 8 4 -6 -8 -6 z" fill="#ffffff"/>
</svg>
