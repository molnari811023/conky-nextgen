#!/usr/bin/env lua

--{{{
--  Conky NextGen Framework
--  Author: István Molnár
--  GitHub: https://github.com/molnari811023/conky-nextgen
--  Description: Modular Conky UI framework (Lua engine + Bash backend)
--}}}

--{{{
-- extreme_test.conf — Extreme stress / memory-leak test launcher.
-- Default mixed test:
--   conky -c ~/.conky/debug/extreme_test.conf
-- Per-renderer 500-item test:
--   CONKY_EXTREME_TEST=calendar conky -c ~/.conky/debug/extreme_test.conf
-- Values: background, line, text, bar, graph, ring, png, svg, calendar,
-- clock, arc, lyrics
--}}}

local test = os.getenv("CONKY_EXTREME_TEST") or "mixed"
local scripts = {
  mixed = "extreme_test.lua",
  background = "extreme_background.lua",
  line = "extreme_line.lua",
  text = "extreme_text.lua",
  bar = "extreme_bar.lua",
  graph = "extreme_graph.lua",
  ring = "extreme_ring.lua",
  png = "extreme_png.lua",
  svg = "extreme_svg.lua",
  calendar = "extreme_calendar.lua",
  clock = "extreme_clock.lua",
  arc = "extreme_arc.lua",
  lyrics = "extreme_lyrics.lua",
}

assert(scripts[test], "Unknown CONKY_EXTREME_TEST: " .. test)

conky.config = {
  background = false,
  out_to_x = true,
  double_buffer = true,
  use_xft = true,
  font = 'Sans:size=10',
  own_window = true,
  own_window_type = 'normal',
  own_window_hints = 'below,sticky,skip_taskbar,skip_pager',
  alignment = 'top_left',
  gap_x = 0,
  gap_y = 0,
  update_interval = 1,
  total_run_times = 0,
  minimum_width = 1920,
  minimum_height = 1080,
  border_inner_margin = 0,
  border_outer_margin = 0,
  border_width = 0,
  lua_load = scripts[test],
  lua_draw_hook_pre = 'conky_core_main',
  lua_shutdown_hook = 'conky_cleanup',
}

conky.text = [[]]
